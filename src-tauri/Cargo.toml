[package]
name = "nvm-desktop"
version = "4.3.1"
description = "Node Version Manager Desktop - A desktop application to manage multiple active node.js versions."
authors = ["The1111mp@outlook.com"]
license = "MIT"
repository = "https://github.com/1111mp/nvm-desktop.git"
default-run = "nvm-desktop"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nvm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0"
bitflags = { version = "2.11" }
chrono = "0.4"
# Use the git repo until the next release after v2.0.0.
dark-light = { git = "https://github.com/rust-dark-light/dark-light" }
dotenvy = "0.15"
dirs = "6.0"
futures = "0.3"
get-node = { path = "crates/get-node" }
log = "0.4"
once_cell = "1"
open = "5"
parking_lot = "0.12"
tauri = { version = "2", features = [
	"image-ico",
	"image-png",
	"protocol-asset",
	"tray-icon",
	"devtools",
] }
tauri-plugin-devtools = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = { version = "2", features = ["colored"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = { path = "crates/window-state" }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
version-compare = "0.2"
warp = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = ["Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time-optimizations.
opt-level = "s"   # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort"   # Higher performance by disabling panic handlers.
strip = true      # Ensures debug symbols are removed.
