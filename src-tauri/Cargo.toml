[package]
name = "nvm-desktop"
version = "4.5.0-rc.1"
description = "Node Version Manager Desktop - A desktop application to manage multiple active node.js versions."
authors = ["The1111mp@outlook.com"]
license = "MIT"
repository = "https://github.com/1111mp/nvm-desktop.git"
default-run = "nvm-desktop"
edition = "2024"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nvm_desktop_lib"

[dependencies]
anyhow = "1.0.104"
bitflags = { version = "2.13.2" }
dark-light = { version = "3.0.0" }
dirs = "7.0.0"
dotenvy = "0.15.7"
futures = "0.3.34"
get-node = { path = "crates/get-node" }
log = "0.4.34"
once_cell = "1.21.4"
open = "5.4.5"
parking_lot = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [
  "devtools",
  "image-ico",
  "image-png",
  "macos-private-api",
  "protocol-asset",
  "tray-icon",
] }
tauri-plugin-devtools = "2.2.2"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-log = { version = "2.10.1", features = ["colored"] }
tauri-plugin-shell = "2.6.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tauri-plugin-wdio = { version = "1.5.1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.5.1", optional = true }
tauri-plugin-window-state = "2.5.0"
tokio = { version = "1.54.1", features = ["full"] }
version-compare = "0.2.1"
warp = { version = "0.4.3", features = ["server"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[profile.release]
opt-level = "s"  # Prioritizes small binary size. Use `3` if you prefer speed.
strip = true  # Ensures debug symbols are removed.
lto = true  # Enables link-time-optimizations.
panic = "abort"  # Higher performance by disabling panic handlers.
codegen-units = 1  # Allows LLVM to perform better optimization.
