[package]
name = "get-node"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-compression = { version = "0.4", default-features = false, features = [
  "tokio",
  "gzip",
] }
async_zip = { version = "0.0.18", default-features = false, features = [
  "deflate",
] }
cfg-if = "1"
futures-lite = "2"
futures-util = "0.3"
hex = { version = "0.4", features = ["std"] }
node-semver = "2"
reqwest = { version = "0.13", features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
astral-tokio-tar = "0.6"
tokio-util = { version = "0.7", features = ["compat"] }
