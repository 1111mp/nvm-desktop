name: Frontend Check

on:
  pull_request:
  workflow_dispatch:

env:
  HUSKY: 0

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check frontend changes
        id: check_frontend
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - '.github/workflows/frontend-check.yml'
              - 'src/**'
              - 'scripts/**'
              - 'test/**'
              - '**/*.js'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.css'
              - '**/*.scss'
              - '**/*.json'
              - '**/*.md'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'eslint.config.ts'
              - 'tsconfig.json'
              - 'tsconfig.app.json'
              - 'tsconfig.node.json'
              - 'vite.config.*'

      - name: Skip if no frontend changes
        if: steps.check_frontend.outputs.frontend != 'true'
        run: echo "No frontend changes, skipping frontend checks."

      - name: Install pnpm
        if: steps.check_frontend.outputs.frontend == 'true'
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        if: steps.check_frontend.outputs.frontend == 'true'
        with:
          node-version: '24.22.1'
          cache: 'pnpm'

      - name: Restore pnpm cache
        if: steps.check_frontend.outputs.frontend == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: "pnpm-shared-stable-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
          restore-keys: |
            pnpm-shared-stable-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
        if: steps.check_frontend.outputs.frontend == 'true'

      - name: Run Prettier check
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm format:check

      - name: Run Oxlint
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm oxlint

      - name: Run TypeScript typecheck
        if: steps.check_frontend.outputs.frontend == 'true'
        run: |
          pnpm type-check
          pnpm type-check:e2e
          pnpm exec tsc --noEmit -p tsconfig.node.json

      - name: Run frontend tests
        if: steps.check_frontend.outputs.frontend == 'true'
        run: |
          mkdir -p test-results/frontend
          set -o pipefail
          pnpm test 2>&1 | tee test-results/frontend/vitest.log

      - name: Upload frontend test diagnostics
        if: failure() && steps.check_frontend.outputs.frontend == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: test-results/frontend/
          if-no-files-found: ignore
